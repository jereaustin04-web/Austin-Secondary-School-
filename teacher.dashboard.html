<!DOCTYPE html>
<html lang="ny">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Dashboard</title>

<style>

body{
    font-family: Arial;
    background:#f1f1f1;
    margin:0;
}

header{
    background:green;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin:15px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

button{
    background:green;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:5px;
}

</style>

</head>

<body>

<header>
<h1>Teacher Dashboard</h1>
<p>School Results Management</p>
</header>


<div class="container">

<div class="card">
<h2>Add Student Results</h2>
<p>Add examination results for students.</p>
<button>Add Results</button>
</div>


<div class="card">
<h2>Edit Results</h2>
<p>Change incorrect student results.</p>
<button>Edit Results</button>
</div>


<div class="card">
<h2>Delete Results</h2>
<p>Remove unwanted results.</p>
<button>Delete Results</button>
</div>


</div>

</body>
</html>
