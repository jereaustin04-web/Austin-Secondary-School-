 
<!DOCTYPE html>
<html lang="ny">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            width: 320px;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            background: green;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
        }
    </style>

</head>

<body>

<div class="box">

<h2>Teacher Login</h2>

<input type="email" placeholder="Teacher Email">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
