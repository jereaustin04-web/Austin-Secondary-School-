<!DOCTYPE html>
<html lang="ny">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Results</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
}

.box{
    background:white;
    width:350px;
    margin:50px auto;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px gray;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    background:blue;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:5px;
}

.result{
    margin-top:20px;
    background:#e8ffe8;
    padding:15px;
    border-radius:5px;
}

</style>

</head>


<body>

<div class="box">

<h2>Check Your Results</h2>

<input type="text" placeholder="Enter Exam Number">

<button>Search Results</button>


<div class="result">

<h3>Results will appear here</h3>

<p>Student Name: --------</p>
<p>Math: --------</p>
<p>English: --------</p>
<p>Science: --------</p>

</div>

</div>


</body>

</html>
